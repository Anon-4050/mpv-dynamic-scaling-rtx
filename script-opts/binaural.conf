# binaural.lua (3D audio) options, one <name>=<value> per line.
# headphones: the output endpoints that are headphones, separated by ; (a part of the device description is enough).
# 3D audio switches on by itself only on these devices; anything else (speakers, TV) gets mpv's plain stereo fold.
# Find the names with: mpv --audio-device=help
headphones=Headphones;USB DAC
# Codecs the gate renders: truehd (default), or * for every multichannel source (AC-3, E-AC-3, DTS, AAC 5.1, ...).
#codecs=*
# 3D stereo (two virtual speakers in front for stereo sources) at start.
#stereo=no
