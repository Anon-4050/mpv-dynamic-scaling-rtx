# aspect-rtx options (script-opts/aspect_rtx.conf, one <name>=<value> per line, no spaces around "=").
# script-opts-append=aspect_rtx-<name>=... lines in mpv.conf override this file.

# ffprobe (from any FFmpeg build) for the start-up pre-build.
# "ffprobe" = found on PATH. If ffprobe is not on PATH, give its full path instead, e.g.
#   prebuild=C:/path/to/ffmpeg/bin/ffprobe.exe
# Leave it empty (prebuild=) to turn the pre-build off.
prebuild=ffprobe
