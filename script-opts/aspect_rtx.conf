# aspect-rtx options (script-opts/aspect_rtx.conf, one <name>=<value> per line, no spaces around "=").
# script-opts-append=aspect_rtx-<name>=... lines in mpv.conf override this file.

# ffprobe (from any FFmpeg build) for the start-up pre-build.
# "ffprobe" = found on PATH. If ffprobe is not on PATH, give its full path instead, e.g.
#   prebuild=C:/path/to/ffmpeg/bin/ffprobe.exe
# Leave it empty (prebuild=) to turn the pre-build off.
prebuild=ffprobe

# RTX VSR: no VSR below this scale (output / input). Below ~1.3x it costs GPU load for almost no visible gain.
#vsr_min_scale=1.3
# Stutter guard: while VSR runs, this many dropped + delayed frames within vsr_guard_window seconds turn VSR off
# for the current file (the card shows "VSR off: stutter"); the next file starts as set. vsr_guard=no turns it off.
#vsr_guard=yes
#vsr_guard_frames=10
#vsr_guard_window=4

# RTX Video HDR: off | fullscreen | always (only for SDR video, only with Windows HDR on before mpv starts).
#hdr_mode=fullscreen
