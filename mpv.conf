gpu-context=d3d11
d3d11-adapter=NVIDIA		# laptops with two GPUs: render + decode on the NVIDIA GPU (without it Windows may pick the iGPU, and VSR / RTX HDR do not run)
hwdec=d3d11va-copy
video-sync=display-resample-vdrop
#interpolation=yes
#icc-profile-auto=yes

#script-opts-append=aspect_rtx-hdr=no
script-opts-append=aspect_rtx-presets=1.9,1.85,1.78,16:9	# crop ratios for Alt+a; Alt+2 / Alt+3 jump to the presets labelled "16:9" / "1.9"
script-opts-append=aspect_rtx-hdr_peak=display	# RTX HDR peak tag = live display peak (stats "Display:"), re-tagged if it moves >5 nits; last value kept in cache/
script-opts-append=aspect_rtx-start=1.9		# default crop at launch: original | 16:9 | 1.9
script-opts-append=smooth-default=auto		# frame blending: auto (only when cadence does not match) | on | off; Alt+i cycles

# AC-3 / E-AC-3 decoder DRC: mpv's default (ad-lavc-ac3drc=0) already plays them as mastered.
# Do not add ad-lavc-o=drc_scale=0: it errors "AVOption 'drc_scale' not found" on every non-AC-3 file.

# Smaller stats overlay (i / I key): stats.lua default font_size is 20.
script-opts-append=stats-font_size=17

# YouTube links: prefer the Dolby E-AC-3 / AC-3 track (often the studio 5.1) when a video has one,
# else the normal best audio.
ytdl-format=bestvideo+bestaudio[acodec^=ec-3]/bestvideo+bestaudio[acodec^=ac-3]/bestvideo+bestaudio/best

