gpu-context=d3d11
d3d11-adapter=NVIDIA		# laptops with two GPUs: render + decode on the NVIDIA GPU (without it Windows may pick the iGPU, and VSR / RTX HDR do not run)
hwdec=d3d11va-copy
video-sync=display-resample-vdrop
#interpolation=yes
#icc-profile-auto=yes

#script-opts-append=aspect_rtx-hdr=no
script-opts-append=aspect_rtx-presets=1.9,1.85,1.78,2.39,16:9	# crop ratios for Alt+a; Alt+2 / Alt+3 jump to the presets labelled "16:9" / "1.9"
script-opts-append=aspect_rtx-hdr_peak=display	# RTX HDR peak tag = live display peak (stats "Display:"), re-tagged if it moves >5 nits; last value kept in cache/
script-opts-append=aspect_rtx-crop=off		# crop at launch: off (release default) | auto (one-shot detection of burned-in black bars) | a preset label
#script-opts-append=aspect_rtx-show=fit		# Show as at launch: fit | half | fill | a preset label
#script-opts-append=rtx_panel-preset=faithful	# apply a card preset at the first file: faithful | immersive | custom (= the settings here)
script-opts-append=smooth-default=off		# frame blending: off (release default) | auto (only when cadence does not match) | on; Alt+i cycles
#script-opts-append=aspect_rtx-prebuild=ffprobe	# ffprobe for the start-up pre-build: "ffprobe" = from PATH, a full path, or empty = off (see script-opts/aspect_rtx.conf)
#script-opts-append=smooth-heavy_mpxs=250	# interpolation auto stays off above this decoded pixel rate (Mpx/s); 0 = no limit

# Audio: keep mpv's volume at 100 and let Windows set the level; mpv's own filters (3D audio, EQ, peak trim) are
# calibrated at 100. Turn Windows audio enhancements and Windows spatial sound OFF for the output device (see README).
volume=100
volume-max=100

# AC-3 / E-AC-3 decoder DRC: mpv's default (ad-lavc-ac3drc=0) already plays them as mastered.
# Do not add ad-lavc-o=drc_scale=0: it errors "AVOption 'drc_scale' not found" on every non-AC-3 file.

# Smaller stats overlay (i / I key): stats.lua default font_size is 20.
script-opts-append=stats-font_size=17

# Release defaults (see README "Defaults and why"): the picture and sound as made; opt in to the rest.
script-opts-append=aspect_rtx-show=fit		# Show as: fit (the picture as it is) | half | fill
script-opts-append=aspect_rtx-hdr=no		# RTX HDR off at start (it changes the look); Alt+h or the panel turns it on
script-opts-append=eq-default=no		# headphone EQ off at start: no profile ships (a correction is only right for the headphone it was measured for)
